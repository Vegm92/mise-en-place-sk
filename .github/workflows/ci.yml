name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history: a secret committed and later "deleted" still lives in
          # past commits, so the scan must cover every commit reachable from
          # this ref — hence --log-opts=HEAD below, and deliberately not --all
          # (and not gitleaks' default, which also walks other fetched refs):
          # scanning every stale branch means any branch's false positive fails
          # every PR's check with a finding the PR cannot fix. Pushes to other
          # branches are covered server-side by GitHub push protection.
          fetch-depth: 0

      - name: Scan git history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --log-opts="HEAD" --redact --exit-code 1

  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mise_en_place_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # DATABASE_URL points to the ephemeral postgres service for all steps.
    # REQUIRE_DB_TESTS=1 turns a disabled DB gate into a hard failure instead
    # of a silent skip, since DATABASE_URL always points at the service above.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mise_en_place_test
      REQUIRE_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history so the duplication-on-new-code check below can diff
          # against the PR base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — ban sql.raw
        run: pnpm lint:no-sql-raw

      - name: Lint — tenant scoping (ADR-001)
        run: pnpm lint:tenant-scope

      - name: Lint — no unscoped tenant queries (ADR-001 / #380)
        run: pnpm lint:unscoped-query

      - name: Lint — form actions have an authorization check (ADR-001 / #517)
        run: pnpm lint:action-authz

      - name: Lint — no new form.get()/formData.get() `as` casts (issue #844)
        run: pnpm lint:form-get-cast

      - name: Lint — inline var(--mep-*) styles stay under the ratchet (issue #845)
        run: pnpm lint:inline-styles

      - name: Lint — no hardcoded user-facing strings
        run: pnpm lint:i18n

      - name: Lint — no explanatory comments in src (per-subsystem Code notes sections)
        run: pnpm lint:no-comments

      - name: Lint — duplication on new code (approximates the SonarCloud gate)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE="origin/main"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$PR_BASE_REF"
          fi
          node scripts/check-duplication.mjs --base "$BASE"

      - name: Type check
        run: pnpm check

      - name: Lint — drizzle/ in sync with schema.ts (ADR-003)
        run: pnpm db:check-sync

      - name: Run migrations
        run: pnpm db:migrate

      - name: Unit tests
        # Always run the full suite, on PRs and on pushes to main alike.
        # `vitest run --changed <base>` used to gate PRs here, selecting only
        # test files whose *import graph* touches the changed files — but a
        # large share of tests/ (58 files and counting) instead grep .svelte
        # or other source files with readFileSync and import nothing from
        # them, so a source change never triggers those tests under
        # `--changed`. That let a real regression merge through a green PR
        # and only surface once it landed on main (see the source-grep test
        # fixes in this commit). The full suite takes ~2.5 minutes, which is
        # cheap next to a red main.
        run: pnpm test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build
        run: pnpm build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_ADMIN_EMAIL: ci@example.com
          AUTH_ADMIN_PASSWORD: ci-password-not-used
          AUTH_ADMIN_RESTAURANT_NAME: CI

  eval-gate:
    # Only runs when the prompt/mapping pipeline changed — it makes real
    # Gemini calls against tests/golden/, so it's kept off unrelated PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Check for extraction pipeline changes
        id: changed
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          if git diff --name-only "$BASE"...HEAD -- \
            src/lib/server/extract.ts \
            src/lib/server/category-guide.ts \
            src/lib/server/normalize.ts \
            src/lib/server/products.ts \
            src/lib/server/supplier.ts \
            src/lib/server/party.ts \
            src/lib/server/document-structure.ts \
            src/lib/server/document-segmentation.ts \
            src/lib/server/pipeline-version.ts \
            tests/golden/ \
            | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.changed.outputs.run == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Golden-set eval gate
        if: steps.changed.outputs.run == 'true'
        run: pnpm eval:gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
