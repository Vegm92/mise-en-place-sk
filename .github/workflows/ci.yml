name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mise_en_place_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # DATABASE_URL points to the ephemeral postgres service for all steps.
    # SUPABASE_* vars are passed to the test step so Supabase-specific suites
    # run when secrets are configured.  REQUIRE_DB_TESTS is set to '1' only
    # when the secret is present, so forks (which lack secrets) still skip
    # gracefully, while a typo'd or dropped secret in the main workflow fails
    # loudly instead of silently thinning coverage.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mise_en_place_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — ban sql.raw
        run: pnpm lint:no-sql-raw

      - name: Lint — tenant scoping (ADR-001)
        run: pnpm lint:tenant-scope

      - name: Type check
        run: pnpm check

      - name: Bootstrap CI database (auth stub for RLS migration)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d mise_en_place_test -f scripts/ci-db-setup.sql

      - name: Run migrations
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_DB_TESTS: ${{ secrets.SUPABASE_URL != '' && '1' || '' }}

      - name: Build
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_ADMIN_EMAIL: ci@example.com
          AUTH_ADMIN_PASSWORD: ci-password-not-used
          AUTH_ADMIN_RESTAURANT_NAME: CI

  extraction-quality:
    name: Extraction accuracy gate (totals ≥ 80%)
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in job-level `if` — referencing it
    # there invalidates the entire workflow file (every run fails in 0s with
    # "workflow file issue"). Gate each step on a job-level env flag instead,
    # so the job is skipped on forks / PRs without the Gemini secret.
    env:
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_GEMINI == 'true'

      - uses: pnpm/action-setup@v4
        if: env.HAS_GEMINI == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: env.HAS_GEMINI == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        if: env.HAS_GEMINI == 'true'
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        if: env.HAS_GEMINI == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install synth dependencies
        if: env.HAS_GEMINI == 'true'
        run: pip install -e "synth[dev]"

      - name: Generate synthetic test fixtures (10 docs, seed 99)
        if: env.HAS_GEMINI == 'true'
        run: |
          cd synth
          python -m synth generate \
            --count 10 \
            --difficulty mixed \
            --formats pdf \
            --seed 99 \
            --output ./output/ci_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run extraction benchmark (gate totals ≥ 80%)
        if: env.HAS_GEMINI == 'true'
        run: |
          cd synth
          python -m synth bench ./output/ci_run \
            --backend gemini \
            --threshold 0.80 \
            --report ../extraction-quality-report.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload benchmark report
        if: always() && env.HAS_GEMINI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extraction-quality-report
          path: extraction-quality-report.md
