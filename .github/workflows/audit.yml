name: Scheduled audit

on:
  # Catches an advisory published against a package already on main, on a
  # day nobody pushes (issue #1118) — the `ci` job's blocking audit only
  # re-checks the tree when a push or a dependency-touching PR triggers it.
  # Minute 37 to land off the top-of-hour rush other repos schedule against.
  schedule:
    - cron: '37 6 * * *'
  # So whoever is clearing an advisory can confirm the fix without waiting
  # for the next cron tick.
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit — no high-severity advisory in the runtime dependency tree (issue #1076)
        run: |
          pnpm audit --prod --audit-level high || {
            echo "See 'Vulnerability audit gate' in docs/04_engineering/dependency_policy.md — bump the dependency, or add a pnpm.overrides entry."
            exit 1
          }
