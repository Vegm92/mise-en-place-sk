<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Mona Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #8a530f; text-decoration: none; }
    a:hover { color: #7e4c0d; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .card { background: #ffffff; border: 1px solid rgba(15, 20, 30, 0.10); border-radius: 10px; box-shadow: 0 1px 0 rgba(15, 20, 30, 0.04), 0 1px 2px rgba(15, 20, 30, 0.04); }
    .label { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; color: #5f6b78; }
    .circ { width: 36px; height: 36px; border-radius: 18px; border: 0; background: #ffffff; color: #4a5562; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); position: relative; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding: 4px 6px; min-width: 50px; }
    .tablbl { font-size: 10.5px; }
    .pill { font-family: inherit; font-size: 12px; line-height: 1; padding: 8px 14px; border: none; border-radius: 999px; white-space: nowrap; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f5f4f0; color: #1a1f26; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; gap: 10px; border-bottom: 1px solid rgba(15, 20, 30, 0.06); background: #f5f4f0;">
    <button type="button" style="width: 34px; height: 34px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #4a5562; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h16"></path><path d="M4 6h16"></path><path d="M4 18h16"></path>
      </svg>
    </button>

    <h1 style="margin: 0; flex: 1; min-width: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Informes</h1>

    <button type="button" class="num" style="height: 34px; padding: 0 10px; min-width: 44px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #4a5562; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">EN</button>

    <button type="button" style="width: 34px; height: 34px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #4a5562; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; flex-shrink: 0;" aria-label="Avisos">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
      </svg>
      <span class="num" style="position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px; font-size: 9px; font-weight: 700; background: #b03a3a; color: #fff; display: inline-flex; align-items: center; justify-content: center;">2</span>
    </button>

    <button type="button" style="width: 34px; height: 34px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #4a5562; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;" aria-label="Cambiar tema">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>

    <span style="height: 34px; padding: 0 12px; border-radius: 6px; background: {{ acc }}; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <path d="m17 8-5-5-5 5"></path><path d="M12 3v12"></path>
      </svg>
    </span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 18px; display: flex; flex-direction: column; gap: 13px;">

    <div style="display: flex; gap: 6px; overflow: hidden; flex-shrink: 0;">
      <sc-for list="{{ periodos }}" as="p" hint-placeholder-count="4">
        <button type="button" class="pill" style="{{ p.estilo }}">{{ p.nombre }}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">Tipo de informe</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{ tipos }}" as="t" hint-placeholder-count="4">
          <button type="button" style="{{ t.estilo }}" onClick="{{ t.pick }}">
            <span style="{{ t.iconoEstilo }}">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="{{ t.d1 }}"></path>
                <path d="{{ t.d2 }}"></path>
                <path d="{{ t.d3 }}"></path>
                <path d="{{ t.d4 }}"></path>
                <path d="{{ t.d5 }}"></path>
              </svg>
            </span>
            <span style="font-size: 13px; font-weight: 600; color: #1a1f26; line-height: 1.3; text-align: left;">{{ t.nombre }}</span>
            <span style="font-size: 11px; color: #5f6b78; line-height: 1.3; text-align: left;">{{ t.grano }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">Estilo</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{ estilos }}" as="e" hint-placeholder-count="3">
          <button type="button" style="{{ e.estilo }}" onClick="{{ e.pick }}">
            <span style="width: 26px; height: 34px; flex-shrink: 0; border-radius: 3px; overflow: hidden; border: 1px solid rgba(15, 20, 30, 0.14); background: #ffffff; display: flex; flex-direction: column;">
              <span style="{{ e.miniBanda }}"></span>
              <span style="flex: 1; min-height: 0; padding: 3px; display: flex; flex-direction: column; gap: 2px; overflow: hidden;">
                <span style="{{ e.miniLinea1 }}"></span>
                <span style="{{ e.miniLinea2 }}"></span>
              </span>
            </span>
            <span style="font-size: 12px; font-weight: 500; color: #1a1f26;">{{ e.nombre }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="card" style="flex: 1; min-height: 0; display: flex; overflow: hidden;">
      <div style="width: 190px; flex-shrink: 0; background: #fafaf7; border-right: 1px solid rgba(15, 20, 30, 0.06); display: flex; align-items: center; justify-content: center; padding: 14px;">
        <div style="height: 92%; aspect-ratio: 210 / 297; background: #ffffff; box-shadow: 0 2px 6px rgba(15, 20, 30, 0.12); display: flex; flex-direction: column; overflow: hidden;">
          <span style="{{ vistaBanda }}"></span>
          <span style="flex: 1; padding: 7px; display: flex; flex-direction: column; gap: 4px;">
            <span style="{{ vistaTitulo }}"></span>
            <span style="{{ vistaKpis }}"></span>
            <span style="height: 1px; background: rgba(15, 20, 30, 0.14);"></span>
            <span style="height: 3px; background: rgba(15, 20, 30, 0.10);"></span>
            <span style="height: 3px; background: rgba(15, 20, 30, 0.10);"></span>
            <span style="height: 3px; background: rgba(15, 20, 30, 0.10);"></span>
            <span style="height: 3px; background: rgba(15, 20, 30, 0.10); width: 64%;"></span>
          </span>
        </div>
      </div>
      <div style="flex: 1; min-width: 0; padding: 13px 14px; display: flex; flex-direction: column; gap: 5px; justify-content: center;">
        <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25;">{{ tituloInforme }}</span>
        <span style="font-size: 11.5px; color: #4a5562; line-height: 1.4;">{{ subtituloInforme }}</span>
        <span class="num" style="font-size: 10.5px; color: #5f6b78; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ nombreArchivo }}</span>
        <span style="font-size: 11px; color: #5f6b78; line-height: 1.35;">CSV: {{ grano }}</span>
      </div>
    </div>

  </div>

  <div style="flex-shrink: 0; padding: 12px 18px 14px; background: #ffffff; border-top: 1px solid rgba(15, 20, 30, 0.06); display: flex; gap: 8px;">
    <button type="button" style="flex: 1; height: 46px; border-radius: 8px; border: 1px solid rgba(15, 20, 30, 0.18); background: #ffffff; color: #1a1f26; font-family: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      </svg>
      CSV
    </button>
    <button type="button" style="flex: 2; height: 46px; border-radius: 8px; border: 0; background: {{ acc }}; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
        <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
      </svg>
      Ver informe
    </button>
  </div>


</div>
</x-dc>

<script data-dc-script data-props='{
  "acento": {"editor": "enum", "options": ["amber", "teal", "slate"], "default": "amber", "section": "Marca"},
  "tipoInicial": {"editor": "enum", "options": ["semanal", "cierre", "precios", "pagos"], "default": "semanal", "section": "Estado inicial"},
  "estiloInicial": {"editor": "enum", "options": ["ejecutivo", "contable", "editorial"], "default": "ejecutivo", "section": "Estado inicial"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const ACENTOS = {
      teal:  { acc: '#0f5f5c', soft: 'rgba(15, 95, 92, 0.10)',  ring: 'rgba(15, 95, 92, 0.30)' },
      slate: { acc: '#34507a', soft: 'rgba(52, 80, 122, 0.10)', ring: 'rgba(52, 80, 122, 0.30)' },
      amber: { acc: '#8a530f', soft: 'rgba(138, 83, 15, 0.10)', ring: 'rgba(138, 83, 15, 0.30)' },
    };
    const pal = ACENTOS[this.props.acento] ?? ACENTOS.amber;
    const acc = pal.acc;

    const tipo   = this.state.tipo   ?? this.props.tipoInicial   ?? 'semanal';
    const estilo = this.state.estilo ?? this.props.estiloInicial ?? 'ejecutivo';

    const ICONOS = {
      semanal: ['M8 2v4', 'M16 2v4', 'M21 10H3', 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'm9 16 2 2 4-4'],
      cierre:  ['M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z', 'M14 2v4a2 2 0 0 0 2 2h4', 'M8 18v-3', 'M12 18v-6', 'M16 18v-2'],
      precios: ['M16 7h6v6', 'm22 7-8.5 8.5-5-5L2 17', '', '', ''],
      pagos:   ['M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z', 'M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8', 'M12 17.5v-11', '', ''],
    };

    const TIPOS = [
      { id: 'semanal', nombre: 'Cierre semanal',      grano: 'Semana 31' },
      { id: 'cierre',  nombre: 'Cierre mensual',      grano: 'Julio 2026' },
      { id: 'precios', nombre: 'Variación de precios', grano: '76 cambios' },
      { id: 'pagos',   nombre: 'Cuentas a pagar',      grano: '30 albaranes' },
    ];
    const ESTILOS = [
      { id: 'ejecutivo', nombre: 'Ejecutivo' },
      { id: 'contable',  nombre: 'Contable' },
      { id: 'editorial', nombre: 'Editorial' },
    ];

    const PERIODOS = tipo === 'semanal'
      ? [{ n: 'Sem. 31', s: true }, { n: 'Sem. 30' }, { n: 'Sem. 29' }, { n: 'Sem. 28' }]
      : [{ n: 'Mes', s: true }, { n: 'Trimestre' }, { n: 'Semestre' }, { n: 'Año' }];

    const CONTENIDO = {
      semanal: { titulo: 'Cierre semanal de compras', sub: 'Semana 31 · 27 jul – 2 ago · 31 albaranes', archivo: 'mep_cierre-semanal_2026-W31', grano: 'una fila por día, 8 columnas' },
      cierre:  { titulo: 'Cierre mensual de compras', sub: 'Julio 2026 · 128 albaranes · 24 proveedores', archivo: 'mep_cierre-mensual_2026-07', grano: 'una fila por categoría, 8 columnas' },
      precios: { titulo: 'Variación de precios',      sub: '76 artículos con cambio · 2 sobre el umbral', archivo: 'mep_variacion-precios_2026-07', grano: 'una fila por artículo, 12 columnas' },
      pagos:   { titulo: 'Estado de cuentas',         sub: '18.744,20 € pendientes · 3.912,60 € vencidos', archivo: 'mep_cuentas-pagar_2026-07', grano: 'una fila por albarán, 10 columnas' },
    };
    const c = CONTENIDO[tipo];

    const tarjeta = 'display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 11px; border-radius: 9px; font-family: inherit; cursor: pointer; min-height: 92px; ';
    const tarjetaSel = tarjeta + 'background: ' + pal.soft + '; border: 1.5px solid ' + acc + ';';
    const tarjetaOff = tarjeta + 'background: #ffffff; border: 1px solid rgba(15, 20, 30, 0.10);';

    const icoSel = 'width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; background: ' + acc + '; color: #ffffff;';
    const icoOff = 'width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; background: rgba(15, 20, 30, 0.05); color: #5f6b78;';

    const chip = 'display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 9px; font-family: inherit; cursor: pointer; min-height: 84px; justify-content: center; ';
    const chipSel = chip + 'background: ' + pal.soft + '; border: 1.5px solid ' + acc + ';';
    const chipOff = chip + 'background: #ffffff; border: 1px solid rgba(15, 20, 30, 0.10);';

    const pillBase = 'font-family: inherit; font-size: 12px; line-height: 1; padding: 8px 14px; border: none; border-radius: 999px; white-space: nowrap; cursor: pointer; ';

    const MINI = {
      ejecutivo: { b: 'height: 6px; background: ' + acc + '; flex-shrink: 0;', l1: 'height: 5px; border-radius: 1px; background: ' + pal.soft + '; border: 1px solid rgba(15, 20, 30, 0.10);', l2: 'height: 2px; border-radius: 1px; background: rgba(15, 20, 30, 0.16);' },
      contable:  { b: 'height: 2px; background: #1a1f26; flex-shrink: 0;', l1: 'height: 2px; background: rgba(15, 20, 30, 0.24);', l2: 'height: 2px; background: rgba(15, 20, 30, 0.24);' },
      editorial: { b: 'height: 14px; background: #B8741A; flex-shrink: 0;', l1: 'height: 3px; border-radius: 1px; background: rgba(15, 20, 30, 0.24); width: 60%;', l2: 'height: 2px; border-radius: 1px; background: ' + acc + ';' },
    };

    const VISTA = {
      ejecutivo: {
        banda: 'height: 12px; background: #ffffff; border-bottom: 2px solid ' + acc + '; flex-shrink: 0;',
        titulo: 'height: 7px; border-radius: 1px; background: rgba(15, 20, 30, 0.30); width: 78%;',
        kpis: 'height: 14px; border-radius: 2px; background: ' + pal.soft + '; border: 1px solid rgba(15, 20, 30, 0.10);',
      },
      contable: {
        banda: 'height: 10px; background: #ffffff; border-bottom: 1px solid #1a1f26; flex-shrink: 0;',
        titulo: 'height: 6px; background: rgba(15, 20, 30, 0.40); width: 88%;',
        kpis: 'height: 12px; border: 1px solid rgba(15, 20, 30, 0.24);',
      },
      editorial: {
        banda: 'height: 34px; background: #B8741A; flex-shrink: 0;',
        titulo: 'height: 9px; border-radius: 1px; background: rgba(15, 20, 30, 0.28); width: 62%;',
        kpis: 'height: 10px; border-radius: 2px; background: ' + pal.soft + ';',
      },
    };

    return {
      acc,
      tituloInforme: c.titulo,
      subtituloInforme: c.sub,
      nombreArchivo: c.archivo + '_casa-bruna',
      grano: c.grano,
      vistaBanda:  VISTA[estilo].banda,
      vistaTitulo: VISTA[estilo].titulo,
      vistaKpis:   VISTA[estilo].kpis,

      periodos: PERIODOS.map((p) => ({
        nombre: p.n,
        estilo: p.s
          ? pillBase + 'background: #ffffff; color: #1a1f26; font-weight: 500; box-shadow: 0 1px 0 rgba(15, 20, 30, 0.04), 0 1px 2px rgba(15, 20, 30, 0.04);'
          : pillBase + 'background: transparent; color: #5f6b78; font-weight: 400; border: 1px solid rgba(15, 20, 30, 0.10);',
      })),

      tipos: TIPOS.map((t) => ({
        nombre: t.nombre,
        grano: t.grano,
        d1: ICONOS[t.id][0], d2: ICONOS[t.id][1], d3: ICONOS[t.id][2], d4: ICONOS[t.id][3], d5: ICONOS[t.id][4],
        estilo:      t.id === tipo ? tarjetaSel : tarjetaOff,
        iconoEstilo: t.id === tipo ? icoSel : icoOff,
        pick: () => this.setState({ tipo: t.id }),
      })),

      estilos: ESTILOS.map((e) => ({
        nombre: e.nombre,
        estilo: e.id === estilo ? chipSel : chipOff,
        miniBanda:  MINI[e.id].b,
        miniLinea1: MINI[e.id].l1,
        miniLinea2: MINI[e.id].l2,
        pick: () => this.setState({ estilo: e.id }),
      })),
    };
  }
}
</script>
</body>
</html>
