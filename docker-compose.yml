# Production topology: one image, two services.
# Works as-is on a VPS; on Railway/Render/Fly, create two services from the
# same repo instead (web: `node build`, worker: `node build/worker.js`) — and
# read the storage note below before you do, because split services there have
# no shared disk.
#
# Storage (issue #285): web writes the uploaded file, the worker reads it back
# to run extraction. With STORAGE_DRIVER=local those two processes MUST see the
# same directory, and it must survive container recreation. The named volume
# below mounts /app/uploads into both services and outlives `docker compose
# down`. On platforms without a shared volume, set STORAGE_DRIVER=railway.
services:
  web:
    build:
      context: .
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    env_file: .env
    environment:
      # Both services must agree on this path, and it must be the mount point
      # of the shared volume — not the relative `uploads` default.
      UPLOADS_DIR: /app/uploads
      # Do NOT set ADDRESS_HEADER/XFF_DEPTH here (issue #500). This compose
      # file publishes port 3000 straight to the host with no reverse proxy in
      # front of it, so there is nothing to overwrite an inbound
      # X-Forwarded-For header — trusting it would let any client spoof its
      # own IP and bypass the login/signup/waitlist rate limits (issue #223).
      # Left unset, getClientAddress() correctly uses the direct socket peer.
      # Only set these two vars when a real reverse proxy (nginx/Caddy, or a
      # platform like Railway) sits in front and rewrites the header itself —
      # see DEPLOYMENT.md's "Reverse proxy / client IP" section.
    volumes:
      - uploads:/app/uploads
    ports:
      - '3000:3000'
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    command: node build/worker.js
    env_file: .env
    environment:
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
