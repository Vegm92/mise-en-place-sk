# SonarQube Cloud analysis configuration.
#
# Which file SonarQube Cloud actually reads, and why it is this one:
#
# This project is analysed by Automatic Analysis — the "SonarCloud Code
# Analysis" check that appears on every pull request. There is no scanner step
# in .github/workflows/ci.yml, so no CI-based analysis ever runs. Automatic
# Analysis reads `.sonarcloud.properties` from the repository root of the
# branch being analysed; it does NOT read `sonar-project.properties`, which is
# only consulted by the CLI/CI scanner. A `sonar-project.properties` carrying
# the exclusions below used to sit here and had no effect on the quality gate
# for exactly that reason; it was removed rather than left as dead
# configuration. If analysis ever moves into CI (adding the SonarQube scan
# action to the workflow, and turning Automatic Analysis off in the project's
# Administration > Analysis Method page), the scope below has to be restated in
# a `sonar-project.properties`, because the scanner ignores this file.
#
# The project key (Vegm92_mise-en-place-sk) is not set here: Automatic Analysis
# takes it from the SonarQube Cloud <-> GitHub binding.
#
# Analysis scope.
#
# docs/ is documentation, not application code. It is never type-checked,
# bundled, executed or shipped. No source code lives there — everything tracked
# under docs/ is .md, .html or .json (check with: git ls-files docs |
# sed 's/.*\.//' | sort -u).
#
# Only one part of it actually defeats analysis, and that is what is excluded
# below: docs/03_features/report_templates/*.dc.html are Design Component
# artboards. Two properties of that format do so:
#
#   - Each artboard is a standalone document. The canvas renders one file per
#     frame with no shared import for page chrome, so the masthead, table
#     styles and navigation are repeated by design. A duplication metric reads
#     that as copy-paste; removing it would break the artboards.
#
#   - Their <script> blocks declare `class Component extends DCLogic`. DCLogic
#     is injected by the design runtime at render time and is deliberately
#     absent from the file, so an analyser sees an undefined base class.
#
# `sonar.exclusions` un-indexes those files completely, which is what both
# failing conditions need: it removes their lines from Duplication on New Code
# and their findings from the Reliability rating. `sonar.cpd.exclusions` is
# deliberately not used — it only suppresses duplication detection while still
# raising issues, so it would fix one condition and not the other, and next to
# a full exclusion it is dead configuration that can drift out of sync.
#
# Why this folder and not all of docs/: `sonar.exclusions` un-indexes files for
# EVERY analyser, secret detection included. Excluding docs/** would stop
# leaked-credential scanning on all 118 tracked .md files — onboarding and
# deployment material, exactly where an example key tends to get pasted.
# Markdown contributes nothing to either failing condition (Sonar does not
# measure duplication or reliability on .md), so the wider pattern buys no gate
# improvement and costs real coverage. Scoping to this one folder keeps secret
# scanning on the other 117 .md files.
#
# The folder rather than just *.dc.html, because canvas.json beside them is the
# same kind of artifact: a generated coordinate manifest for the canvas (one
# repeated block per frame), not something anyone hand-maintains or can act on
# a finding in. With the artboards excluded this PR's remaining new code is
# ~28 lines of CSS, and against a denominator that small one repetitive
# manifest could swing Duplication on New Code on its own. The design-canvas
# bundle is one unit; it is excluded as one unit.
sonar.exclusions=docs/03_features/report_templates/**
