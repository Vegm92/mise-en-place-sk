[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "synth"
version = "0.1.0"
description = "Synthetic Spanish invoice/albarán generator for mise-en-place extraction benchmarking"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["synth*"]
