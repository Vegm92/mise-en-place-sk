<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mise en Place · Admin</title>

<!-- Mona Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Design tokens (shared with main app) -->
<link rel="stylesheet" href="app/tokens.css" />

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Mona Sans', system-ui, sans-serif; }
  @keyframes mepspin { to { transform: rotate(360deg); } }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Component library -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/admin.jsx"></script>

<script type="text/babel">
const W = 1440;

// Heights tuned to content (no inner scroll — artboards are static frames)
const H_OVERVIEW = 720;
const H_HEALTH   = 880;
const H_EVENTS   = 720;

function App() {
  return (
    <DesignCanvas minScale={0.06} maxScale={3}>

      {/* ────────────────────────────────────────────────────────────
          OVERVIEW — /admin
          ──────────────────────────────────────────────────────────── */}
      <DCSection id="overview"
        title="01 · Overview — /admin"
        subtitle="System-wide KPIs, pending alerts and a system-health summary. Light + dark.">

        <DCArtboard id="ov-light" label="Overview · light"
          width={W} height={H_OVERVIEW}>
          <AdminArtboard page="overview" theme="light"
            screenLabel="01 Admin · overview · light" />
        </DCArtboard>

        <DCArtboard id="ov-dark" label="Overview · dark"
          width={W} height={H_OVERVIEW}>
          <AdminArtboard page="overview" theme="dark"
            screenLabel="01 Admin · overview · dark" />
        </DCArtboard>
      </DCSection>

      {/* ────────────────────────────────────────────────────────────
          HEALTH — /admin/health
          ──────────────────────────────────────────────────────────── */}
      <DCSection id="health"
        title="02 · Health — /admin/health"
        subtitle="Endpoint payload for external uptime monitors. Big status, diagnostics row, response body.">

        <DCArtboard id="hl-light" label="Health · OK (light)"
          width={W} height={H_HEALTH}>
          <AdminArtboard page="health" theme="light"
            screenLabel="02 Admin · health · light" />
        </DCArtboard>

        <DCArtboard id="hl-dark" label="Health · OK (dark)"
          width={W} height={H_HEALTH}>
          <AdminArtboard page="health" theme="dark"
            screenLabel="02 Admin · health · dark" />
        </DCArtboard>
      </DCSection>

      {/* ────────────────────────────────────────────────────────────
          EVENTS — /admin/events  (locked stub)
          ──────────────────────────────────────────────────────────── */}
      <DCSection id="events"
        title="03 · Events — /admin/events"
        subtitle="Greyed-out locked state until issue #29 ships the events table.">

        <DCArtboard id="ev-light" label="Events · locked (light)"
          width={W} height={H_EVENTS}>
          <AdminArtboard page="events" theme="light"
            screenLabel="03 Admin · events · light" />
        </DCArtboard>

        <DCArtboard id="ev-dark" label="Events · locked (dark)"
          width={W} height={H_EVENTS}>
          <AdminArtboard page="events" theme="dark"
            screenLabel="03 Admin · events · dark" />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
