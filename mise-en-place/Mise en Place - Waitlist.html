<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mise en Place · Lista de espera</title>

<!-- Mona Sans + JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Design tokens -->
<link rel="stylesheet" href="app/tokens.css" />

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Mona Sans', system-ui, sans-serif; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Component libraries -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>

<!-- Waitlist code -->
<script type="text/babel" src="app/waitlist-shared.jsx"></script>
<script type="text/babel" src="app/waitlist-variants-ab.jsx"></script>
<script type="text/babel" src="app/waitlist-variant-c.jsx"></script>

<script type="text/babel">
const W = 1280;

// Heights per artboard (tall enough to fit everything; canvas allows scroll inside if needed)
const HEIGHTS = {
  A: 5200,
  B: 4700,
  C: 5300,
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "auto",
  "headline": "auto",
  "showFounder": true,
  "showFAQ": true,
  "showSpotCounter": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // theme: auto (each variant's native theme), light, dark
  // For 'auto', A = light, B = light, C = dark
  const resolveTheme = (variant) => {
    if (tweaks.theme === 'auto') {
      return variant === 'C' ? 'dark' : 'light';
    }
    return tweaks.theme;
  };

  // headline: auto (each variant's native), or one of brain/direct/craft
  const resolveHeadline = (variant) => {
    if (tweaks.headline === 'auto') {
      return variant === 'A' ? 'brain' : variant === 'B' ? 'craft' : 'direct';
    }
    return tweaks.headline;
  };

  const show = {
    founder:     tweaks.showFounder,
    faq:         tweaks.showFAQ,
    spotCounter: tweaks.showSpotCounter,
  };

  return (
    <React.Fragment>
      <DesignCanvas minScale={0.04} maxScale={2}>

        {/* ─── Variant A — Refined ────────────────────────────── */}
        <DCSection id="refined"
          title="A · Refined"
          subtitle="Centered hero, classic structure, light + one dark slab. The safe pick — feels like a serious product page.">

          <DCArtboard id="refined-main" label="Refined · light/auto"
            width={W} height={HEIGHTS.A}>
            <WLVariantA
              theme={resolveTheme('A')}
              headlineKey={resolveHeadline('A')}
              show={show} />
          </DCArtboard>

          <DCArtboard id="refined-dark" label="Refined · dark"
            width={W} height={HEIGHTS.A}>
            <WLVariantA
              theme="dark"
              headlineKey={resolveHeadline('A')}
              show={show} />
          </DCArtboard>
        </DCSection>

        {/* ─── Variant B — Editorial ──────────────────────────── */}
        <DCSection id="editorial"
          title="B · Editorial"
          subtitle="Magazine-issue layout with masthead, byline rails, italic display, and a dark front-page CTA. For the brand-led, craft-forward route.">

          <DCArtboard id="editorial-main" label="Editorial · light"
            width={W} height={HEIGHTS.B}>
            <WLVariantB
              theme={resolveTheme('B')}
              headlineKey={resolveHeadline('B')}
              show={show} />
          </DCArtboard>

          <DCArtboard id="editorial-dark" label="Editorial · dark"
            width={W} height={HEIGHTS.B}>
            <WLVariantB
              theme="dark"
              headlineKey={resolveHeadline('B')}
              show={show} />
          </DCArtboard>
        </DCSection>

        {/* ─── Variant C — Experimental ───────────────────────── */}
        <DCSection id="experimental"
          title="C · Experimental"
          subtitle="Dark-first split hero with floating product stack, live invoice ticker, sticker callouts, and stats rendered as massive editorial type. The boldest direction.">

          <DCArtboard id="experimental-main" label="Experimental · dark"
            width={W} height={HEIGHTS.C}>
            <WLVariantC
              theme={resolveTheme('C')}
              headlineKey={resolveHeadline('C')}
              show={show} />
          </DCArtboard>

          <DCArtboard id="experimental-light" label="Experimental · light"
            width={W} height={HEIGHTS.C}>
            <WLVariantC
              theme="light"
              headlineKey={resolveHeadline('C')}
              show={show} />
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      {/* ─── Tweaks panel ─── */}
      <TweaksPanel title="Waitlist tweaks">
        <TweakSection label="Theme">
          <TweakRadio
            label="Mode"
            options={[
              { value: 'auto',  label: 'Auto' },
              { value: 'light', label: 'Light' },
              { value: 'dark',  label: 'Dark' },
            ]}
            value={tweaks.theme}
            onChange={(v) => setTweak('theme', v)} />
        </TweakSection>

        <TweakSection label="Headline">
          <TweakSelect
            label="Variant"
            options={[
              { value: 'auto',   label: 'Auto · each variant picks its own' },
              { value: 'brain',  label: 'El cerebro operativo de tu cocina.' },
              { value: 'direct', label: 'Sabe en qué gasta tu cocina, antes que tú.' },
              { value: 'craft',  label: 'Tus facturas, leídas. Tu margen, defendido.' },
            ]}
            value={tweaks.headline}
            onChange={(v) => setTweak('headline', v)} />
        </TweakSection>

        <TweakSection label="Sections">
          <TweakToggle
            label="Founder note"
            value={tweaks.showFounder}
            onChange={(v) => setTweak('showFounder', v)} />
          <TweakToggle
            label="FAQ accordion"
            value={tweaks.showFAQ}
            onChange={(v) => setTweak('showFAQ', v)} />
          <TweakToggle
            label="Spot counter (43 / 50)"
            value={tweaks.showSpotCounter}
            onChange={(v) => setTweak('showSpotCounter', v)} />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
