<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1320" />
<title>Mise en Place · Lista de espera — print</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app/tokens.css" />

<style>
  /* Screen + print base */
  html, body { margin: 0; padding: 0; background: #f5f4f0; }
  body { font-family: 'Mona Sans', system-ui, sans-serif; }
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  /* The print sheet: ~A3 portrait dimensions in CSS pixels @ 96dpi
     (297 × 420 mm ≈ 1123 × 1587 px). We use the actual design width
     1280 so we render at 1:1 with a small side margin. */
  @page {
    size: 1320px 1870px;
    margin: 0;
  }

  .print-sheet {
    width: 1280px;
    margin: 0 auto;
    background: #f5f4f0;
  }

  /* Each variant occupies its own group of pages */
  .print-variant {
    width: 1280px;
    break-before: page;
    page-break-before: always;
  }
  .print-variant:first-child {
    break-before: auto;
    page-break-before: auto;
  }

  /* Variant cover page header */
  .print-cover {
    width: 1280px;
    height: 1820px;        /* fills one print page */
    padding: 80px 96px;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    background: var(--mep-bg, #f5f4f0);
    border-top: 16px solid #b8741a;
    break-after: page;
    page-break-after: always;
  }
  .print-cover .meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px; color: #7a8492;
    letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 600;
    display: flex; gap: 18px; align-items: center;
    margin-bottom: 48px;
  }
  .print-cover .meta .pip {
    width: 8px; height: 8px; border-radius: 4px; background: #b8741a;
    box-shadow: 0 0 0 4px rgba(184,116,26,0.18);
  }
  .print-cover h1 {
    margin: 0; font-size: 200px; font-weight: 700;
    letter-spacing: -8px; line-height: 0.9;
    color: #1a1714;
  }
  .print-cover h1 em {
    color: #b8741a; font-style: italic; font-weight: 500;
  }
  .print-cover .tagline {
    margin-top: 64px; font-size: 32px; line-height: 1.3;
    color: #4a5562; max-width: 900px; letter-spacing: -0.6px;
  }
  .print-cover .spacer { flex: 1; }
  .print-cover .footnote {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(0,0,0,0.1);
    padding-top: 28px;
  }
  .print-cover .footnote .left,
  .print-cover .footnote .right {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px; color: #7a8492; letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 500;
    line-height: 1.7;
  }
  .print-cover .footnote strong {
    color: #1a1714; font-weight: 600;
  }

  /* Restrict useful break-inside on cards inside variants */
  .mep .card,
  .mep [class*="card"] {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  /* Avoid breaking headlines mid-line */
  .mep h1, .mep h2, .mep h3 {
    break-inside: avoid;
    page-break-inside: avoid;
    break-after: avoid;
    page-break-after: avoid;
  }
  /* Hide tweaks panel and any fixed/overlay UI */
  .twk-panel, .dc-frame, [data-design-canvas] {
    display: none !important;
  }

  /* Each variant — kill any internal overflow:hidden so all content prints */
  .print-variant > div {
    overflow: visible !important;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/waitlist-shared.jsx"></script>
<script type="text/babel" src="app/waitlist-variants-ab.jsx"></script>
<script type="text/babel" src="app/waitlist-variant-c.jsx"></script>

<script type="text/babel">
function Cover({ idx, label, name, sub }) {
  return (
    <section className="print-cover">
      <div className="meta">
        <span className="pip" />
        <span>Mise en Place · Lista de espera</span>
        <span>·</span>
        <span>Variante {label}</span>
        <span>·</span>
        <span>Mayo 2026</span>
      </div>
      <h1>{name.split(' ')[0]}<br /><em>{name.split(' ').slice(1).join(' ')}</em></h1>
      <p className="tagline">{sub}</p>
      <div className="spacer" />
      <div className="footnote">
        <div className="left">
          <strong>Variante {label} de C</strong><br />
          1.280 × continuo · escala 1:1
        </div>
        <div className="right">
          Mise en Place<br />
          Barcelona · 2026
        </div>
      </div>
    </section>
  );
}

const show = { founder: true, faq: true, spotCounter: true };

function PrintApp() {
  return (
    <div className="print-sheet">
      {/* Title page */}
      <section className="print-cover" style={{ breakBefore: 'auto', pageBreakBefore: 'auto' }}>
        <div className="meta">
          <span className="pip" />
          <span>Lista de espera · Tres direcciones</span>
        </div>
        <h1 style={{ fontSize: 180, letterSpacing: -7 }}>
          Mise<br />
          <em>en Place.</em>
        </h1>
        <p className="tagline">
          Tres direcciones de diseño para la página de lista de espera.
          Mismo sistema (Mona Sans + acento ámbar), mismas secciones,
          tres tonos distintos: refinado, editorial y experimental.
        </p>
        <div className="spacer" />
        <div className="footnote">
          <div className="left">
            <strong>Tres variantes</strong><br />
            Refined · Editorial · Experimental
          </div>
          <div className="right">
            Mayo 2026 · Barcelona<br />
            Confidencial · borrador
          </div>
        </div>
      </section>

      {/* Variant A */}
      <section className="print-variant">
        <Cover idx={1} label="A" name="A · Refined"
          sub="Hero centrado, ritmo SaaS clásico, mayormente claro con una franja oscura para «cómo funciona». La opción segura y terminable." />
        <WLVariantA theme="light" headlineKey="brain" show={show} />
      </section>

      {/* Variant B */}
      <section className="print-variant">
        <Cover idx={2} label="B" name="B · Editorial"
          sub="Maquetación de revista con cabecera, columnas con cifras al margen, display itálico y un cierre tipo portada en negro. Marca, oficio, intención." />
        <WLVariantB theme="light" headlineKey="craft" show={show} />
      </section>

      {/* Variant C */}
      <section className="print-variant">
        <Cover idx={3} label="C" name="C · Experimental"
          sub="Hero en oscuro con la app flotando a la derecha, ticker en vivo de facturas, pegatinas y los datos del problema como tipografía monumental." />
        <WLVariantC theme="dark" headlineKey="direct" show={show} />
      </section>
    </div>
  );
}

// Wait for fonts + Babel + a small margin before printing
(async () => {
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
  } catch {}
  ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);
  // Wait for React commit + give layout time to settle
  await new Promise(r => setTimeout(r, 1200));
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
  } catch {}
  await new Promise(r => setTimeout(r, 500));
  window.print();
})();
</script>
</body>
</html>
